name: Snapshot ranks
# Krever repo-secrets APP_BASE_URL (f.eks. https://dart-vm-spillet.vercel.app, uten avsluttende /)
# og SYNC_SECRET (samme verdi som SYNC_SECRET i Vercel-miljøvariablene).

on:
  # Den daglige kjøringen (cron 06:00 UTC) er slått av 2026-10-16: jobben feilet hver dag og sendte e-post.
  # Rang-pilene ▲/▼ hører til poengspillet. Legg schedule: - cron: '0 6 * * *' tilbake før VM i desember.
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call snapshot-ranks
        run: |
          curl -sf "${{ secrets.APP_BASE_URL }}/api/snapshot-ranks?secret=${{ secrets.SYNC_SECRET }}"
